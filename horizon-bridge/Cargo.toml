[package]
name = "horizon-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "C ABI over Horizon's vanilla worldgen, for the Paper plugin to call through Java's FFM API"

[lib]
name = "horizon_bridge"
crate-type = ["cdylib"]

[dependencies]
horizon-world = { path = "../third_party/horizon/crates/horizon-world" }
horizon-core = { path = "../third_party/horizon/crates/horizon-core" }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
